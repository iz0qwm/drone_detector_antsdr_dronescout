<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portable Air Awareness Node</title>

    <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
    <script src="vendor/leaflet/leaflet.js"></script>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/drawer.css">
</head>
<body>

    <header class="topbar">
        <div class="title">
            Portable Air Awareness Node
        </div>

        <div class="status-bar">
            <span id="hostname">---</span>
            <span id="cpu">CPU --%</span>
            <span id="ram">RAM --%</span>
            <span id="disk">DISK --%</span>
        </div>

        <button id="drawerToggle">☰</button>
    </header>

    <div id="map"></div>

    <aside id="drawer" class="drawer">
        <h2>System</h2>

        <div class="drawer-section">

            <h3>Network</h3>

            <div id="networkStatus" class="network-status">
                Loading...
            </div>

            <button id="networkSettingsToggle" class="collapsible-btn">
                Network Settings
            </button>

            <div id="networkSettingsPanel" class="collapsible-panel">

                <button id="scanWifiBtn">
                    Scan WiFi Networks
                </button>

                <button id="disconnectWifiBtn">
                    Disconnect WiFi
                </button>

                <div id="wifiNetworks" class="wifi-networks"></div>

                <hr>

                <h4>User LAN</h4>

                <input
                    id="lanIp"
                    class="rounded-input"
                    placeholder="10.0.0.50"
                >

                <input
                    id="lanMask"
                    class="rounded-input"
                    placeholder="255.255.255.0"
                    value="255.255.255.0"
                >

                <input
                    id="lanGateway"
                    class="rounded-input"
                    placeholder="10.0.0.1"
                >

                <button id="saveLanBtn">
                    Save Config
                </button>

            </div>

        </div>

        <div class="drawer-section">
            <h3>Services</h3>
            <div>
                Remote ID: OFF<br>
                ADS-B: OFF<br>
                GPS: OFF
            </div>
        </div>

        <div class="drawer-section">
            <h3>Settings</h3>
            <button>System Settings</button>
        </div>
    </aside>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="js/drawer.js"></script>
    <script src="js/dashboard.js"></script>

</body>
</html>
